<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="ub-bg" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E1F"/>
      <stop offset="1" stop-color="#221033"/>
    </linearGradient>
    <linearGradient id="ub-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#CBACF9"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <radialGradient id="ub-glow" cx="0.25" cy="0.3" r="0.6">
      <stop stop-color="#5B8DEF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#ub-bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#ub-glow)"/>
  <!-- agent network -->
  <g transform="translate(70,90)">
    <g stroke="#CBACF9" stroke-width="2" opacity="0.6">
      <path d="M70 70 L0 10 M70 70 L0 130 M70 70 L150 30 M70 70 L150 110"/>
    </g>
    <circle cx="70" cy="70" r="30" fill="#12172E" stroke="url(#ub-accent)" stroke-width="3"/>
    <text x="70" y="78" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#CBACF9" text-anchor="middle">AI</text>
    <g fill="#12172E" stroke="#5B8DEF" stroke-width="2.5">
      <circle cx="0" cy="10" r="16"/><circle cx="0" cy="130" r="16"/>
      <circle cx="150" cy="30" r="16"/><circle cx="150" cy="110" r="16"/>
    </g>
  </g>
  <!-- cart -->
  <g transform="translate(266,250)" stroke="url(#ub-accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 H16 L26 56 H78 L92 16 H30"/>
    <circle cx="34" cy="74" r="7" fill="#CBACF9" stroke="none"/>
    <circle cx="72" cy="74" r="7" fill="#CBACF9" stroke="none"/>
  </g>
  <text x="262" y="118" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">UnionBuy</text>
  <text x="264" y="154" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#CBACF9">Multi-Agent Bulk Shopping</text>
  <text x="264" y="188" font-family="Arial, sans-serif" font-size="17" fill="#9CA3C4">AWS Bedrock · Strands SDK · React Native</text>
</svg>
