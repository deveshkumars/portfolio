<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bm-bg" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E1F"/>
      <stop offset="1" stop-color="#2A0F1F"/>
    </linearGradient>
    <linearGradient id="bm-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F9C46B"/>
      <stop offset="1" stop-color="#CBACF9"/>
    </linearGradient>
    <radialGradient id="bm-glow" cx="0.25" cy="0.3" r="0.6">
      <stop stop-color="#F9C46B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F9C46B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bm-bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#bm-glow)"/>
  <!-- film strip -->
  <g transform="translate(70,110)">
    <rect x="0" y="0" width="170" height="150" rx="12" fill="#12172E" stroke="url(#bm-accent)" stroke-width="3"/>
    <g fill="#0A0E1F" stroke="url(#bm-accent)" stroke-width="2">
      <rect x="-2" y="14" width="16" height="16" rx="3"/><rect x="-2" y="46" width="16" height="16" rx="3"/>
      <rect x="-2" y="78" width="16" height="16" rx="3"/><rect x="-2" y="110" width="16" height="16" rx="3"/>
      <rect x="156" y="14" width="16" height="16" rx="3"/><rect x="156" y="46" width="16" height="16" rx="3"/>
      <rect x="156" y="78" width="16" height="16" rx="3"/><rect x="156" y="110" width="16" height="16" rx="3"/>
    </g>
    <!-- play -->
    <circle cx="85" cy="75" r="34" fill="#0A0E1F" stroke="url(#bm-accent)" stroke-width="3"/>
    <path d="M75 56 L108 75 L75 94 Z" fill="url(#bm-accent)"/>
  </g>
  <text x="268" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">Brown Motion</text>
  <text x="268" y="158" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">Picture Site</text>
  <text x="270" y="196" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#F9C46B">94 Lighthouse Score</text>
  <text x="270" y="226" font-family="Arial, sans-serif" font-size="17" fill="#9CA3C4">Next.js · TailwindCSS · Python</text>
</svg>
